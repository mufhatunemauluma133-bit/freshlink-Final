<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self' data: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">

<title>FreshLink Messages</title>
<link rel="stylesheet" href="style.css">
<style>
    .chat-container {
        display: flex;
        height: calc(100dvh - 150px);
        min-height: 420px;
        background: rgba(8, 16, 31, 0.6);
    }

    .conversations-list {
        width: 100%;
        max-width: 100%;
        border-right: 1px solid rgba(148, 163, 184, 0.12);
        overflow-y: auto;
        padding-bottom: 90px;
    }

    .conversation {
        display: flex;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        cursor: pointer;
        transition: background 0.2s;
    }

    .conversation:hover {
        background: rgba(34, 197, 94, 0.08);
    }

    .conversation.active {
        background: rgba(34, 197, 94, 0.15);
        border-left: 3px solid #22c55e;
    }

    .conv-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #22c55e, #14b8a6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
        margin-right: 12px;
        position: relative;
    }

    .conv-avatar .status {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #22c55e;
        bottom: 0;
        right: 0;
        border: 2px solid rgba(8, 16, 31, 0.9);
    }

    .conv-info {
        flex: 1;
        min-width: 0;
    }

    .conv-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .conv-name {
        font-weight: 600;
        color: #f8fafc;
        font-size: 14px;
    }

    .conv-time {
        font-size: 12px;
        color: #94a3b8;
    }

    .conv-preview {
        font-size: 13px;
        color: #cbd5e1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .conv-unread {
        background: #22c55e;
        color: #fff;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
    }

    .chat-view {
        display: none;
        flex-direction: column;
        width: 100%;
        min-width: 0;
    }

    .chat-view.active {
        display: flex;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .chat-user-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #22c55e, #14b8a6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    .chat-user-details h3 {
        margin: 0;
        font-size: 14px;
        color: #f8fafc;
    }

    .chat-user-details p {
        margin: 0;
        font-size: 11px;
        color: #94a3b8;
    }

    .chat-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .chat-action-btn {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.3);
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .message {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }

    .message.sent {
        justify-content: flex-end;
    }

    .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
    }

    .message-bubble {
        max-width: 70%;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: #f8fafc;
        font-size: 14px;
        line-height: 1.4;
    }

    .message.sent .message-bubble {
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        border: none;
        color: #fff;
    }

    .message-time {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
    }

    .chat-input-area {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        background: rgba(15, 23, 42, 0.95);
        border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .chat-input-area input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(8, 16, 31, 0.9);
        color: #f8fafc;
        font-size: 14px;
        margin-top: 0;
    }

    .chat-send-btn {
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #94a3b8;
        gap: 12px;
    }

    .empty-state h2 {
        font-size: 18px;
        color: #cbd5e1;
    }

    .chat-requests {
        padding: 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .chat-requests h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #f8fafc;
    }

    .request-card {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 18px;
        padding: 14px;
        margin-bottom: 12px;
    }

    .request-card h4 {
        margin: 0 0 6px;
        font-size: 15px;
        color: #f8fafc;
    }

    .request-card p {
        margin: 4px 0;
        font-size: 13px;
        color: #94a3b8;
    }

    .request-card button {
        margin-top: 10px;
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 700;
        width: 100%;
    }

    .request-card button[disabled] {
        opacity: 0.6;
        cursor: default;
    }

    @media (max-width: 700px) {
        .chat-container {
            height: calc(100dvh - 100px);
        }

        .chat-header {
            align-items: flex-start;
            gap: 10px;
            flex-direction: column;
        }

        .chat-actions {
            width: 100%;
            justify-content: flex-start;
            gap: 8px;
        }

        .chat-action-btn {
            flex: 1 1 auto;
        }
        
        .message-bubble {
            max-width: 85%;
        }
    }

    @media (min-width: 960px) {
        .chat-container {
            max-width: 1100px;
            margin: 0 auto;
            border-left: 1px solid rgba(148, 163, 184, 0.12);
            border-right: 1px solid rgba(148, 163, 184, 0.12);
        }

        .conversations-list {
            max-width: 360px;
            width: 360px;
        }

        .chat-view {
            display: flex;
        }
    }
</style>
</head>
<body>
<script type="module" src="app.js"></script>

<div class="topbar">
    <div>ðŸ’¬ Messages</div>
    <div style="width: 30px;"></div>
</div>

<div class="chat-container">
    <div class="conversations-list" id="conversationsList">
        <div id="requestsSection"></div>
        <div id="conversationsSection">
            <div class="empty-state">
                <h2>No conversations yet</h2>
                <p>Start messaging with farmers and suppliers</p>
            </div>
        </div>
    </div>

    <div class="chat-view" id="chatView">
        <div class="chat-header">
            <div class="chat-user-info">
                <div class="chat-user-avatar" id="chatAvatar">ðŸ‘¤</div>
                <div class="chat-user-details">
                    <h3 id="chatUserName">User</h3>
                    <p id="chatUserStatus">Online</p>
                </div>
            </div>
            <div class="chat-actions">
                <button class="chat-action-btn" onclick="callUser()">Call Seller</button>
                <button class="chat-action-btn" onclick="viewProfile()">View Profile</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input id="messageInput" type="text" placeholder="Type a message...">
            <button class="chat-send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<div class="navbar">
    <button onclick="window.location.href='home.html'">Home</button>
    <button onclick="window.location.href='feed.html'">Feed</button>
    <button onclick="window.location.href='jobs.html'">Jobs</button>
    <button class="active" onclick="window.location.href='chat.html'">Chat</button>
    <button onclick="window.location.href='settings.html'">Settings</button>
</div>

<script type="module" src="chat.js"></script>
</body>
</html>
