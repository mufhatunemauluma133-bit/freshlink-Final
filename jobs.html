<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self' data: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">

<title>FreshLink Jobs</title>
<link rel="stylesheet" href="style.css">
<style>
    .jobs-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.95);
        gap: 12px;
    }

    .jobs-header h1 {
        margin: 0;
        font-size: 18px;
        flex: 1;
    }

    .post-job-btn {
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
    }

    .jobs-filters {
        padding: 14px 16px;
        display: flex;
        gap: 10px;
        overflow-x: auto;
        background: rgba(8, 16, 31, 0.6);
    }

    .filter-btn {
        padding: 8px 14px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.95);
        color: #f8fafc;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        transition: all 0.2s;
    }

    .filter-btn.active {
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        border: none;
        color: white;
    }

    .jobs-list {
        padding: 16px;
        padding-bottom: 100px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .job-card {
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid rgba(148, 163, 184, 0.08);
        border-radius: 20px;
        padding: 18px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .job-card:hover {
        border-color: #22c55e;
        box-shadow: 0 8px 24px rgba(34, 197, 94, 0.12);
    }

    .job-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 12px;
    }

    .job-title {
        font-size: 16px;
        font-weight: 700;
        color: #f8fafc;
    }

    .job-salary {
        background: rgba(34, 197, 94, 0.15);
        color: #a7f3d0;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
    }

    .job-company {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 10px;
    }

    .job-company-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #22c55e, #14b8a6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
    }

    .job-description {
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 12px;
    }

    .job-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 14px;
        font-size: 12px;
    }

    .job-meta-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #94a3b8;
    }

    .job-type-badge {
        display: inline-block;
        background: rgba(37, 99, 235, 0.15);
        color: #93c5fd;
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
    }

    .job-actions {
        display: flex;
        gap: 10px;
    }

    .job-apply-btn {
        flex: 1;
        background: linear-gradient(135deg, #22c55e 0%, #14b8a6 100%);
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
    }

    .job-save-btn {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.3);
        padding: 10px 14px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
    }

    .job-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 200;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }

    .job-modal.active {
        display: flex;
    }

    .job-modal-content {
        background: rgba(10, 18, 34, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 24px;
        padding: 24px;
        max-width: 500px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
    }

    .modal-close {
        float: right;
        background: none;
        border: none;
        color: #f8fafc;
        font-size: 24px;
        cursor: pointer;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        color: #94a3b8;
    }

    .empty-state h2 {
        font-size: 18px;
        color: #cbd5e1;
        margin-bottom: 8px;
    }

    @media (max-width: 700px) {
        .jobs-header {
            flex-direction: column;
            align-items: stretch;
        }

        .jobs-header h1 {
            font-size: 17px;
        }

        .job-header {
            flex-direction: column;
            gap: 8px;
        }

        .job-salary {
            align-self: flex-start;
        }

        .job-actions {
            flex-direction: column;
        }

        .job-save-btn,
        .job-apply-btn {
            width: 100%;
        }

        .job-modal-content {
            padding: 18px;
            max-height: 84dvh;
        }
    }

    @media (min-width: 960px) {
        .jobs-list {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
        }
    }
</style>
</head>
<body>
<script type="module" src="app.js"></script>

<div class="topbar">
    <div>ðŸ’¼ Jobs</div>
    <div style="width: 30px;"></div>
</div>

<div class="jobs-header">
    <h1>Available Opportunities</h1>
    <button class="post-job-btn" onclick="window.location.href='post-job.html'">+ Post Job</button>
</div>

<div class="jobs-filters">
    <button class="filter-btn active" onclick="filterJobs('all', this)">All Jobs</button>
    <button class="filter-btn" onclick="filterJobs('full-time', this)">Full Time</button>
    <button class="filter-btn" onclick="filterJobs('part-time', this)">Part Time</button>
    <button class="filter-btn" onclick="filterJobs('contract', this)">Contract</button>
    <button class="filter-btn" onclick="filterJobs('seasonal', this)">Seasonal</button>
</div>

<div id="jobsStatus" class="message" style="display:none; margin: 10px 16px 0;"></div>
<div class="jobs-list" id="jobsList"></div>

<div class="job-modal" id="jobModal">
    <div class="job-modal-content">
        <button class="modal-close" onclick="closeJobModal()">Back</button>
        <div id="modalContent"></div>
        <div style="margin-top: 20px; display: flex; gap: 12px;">
            <button class="job-apply-btn" onclick="submitApplication()">Apply Now</button>
            <button class="job-save-btn" onclick="closeJobModal()">Close</button>
        </div>
    </div>
</div>

<div class="navbar">
    <button onclick="window.location.href='home.html'">Home</button>
    <button onclick="window.location.href='feed.html'">Feed</button>
    <button class="active" onclick="window.location.href='jobs.html'">Jobs</button>
    <button onclick="window.location.href='chat.html'">Chat</button>
    <button onclick="window.location.href='settings.html'">Settings</button>
</div>

<script type="module" src="jobs.js"></script>
</body>
</html>
