<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self' data: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">

<title>Verification Requests</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <div class="topbar">
        <button onclick="window.location.href='settings.html'">Back</button>
        <div class="title">Verification Requests</div>
        <div style="width:30px;"></div>
    </div>

    <div class="settings-container">
        <div id="verificationStatus" class="section"></div>
    </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const statusBox = document.getElementById("verificationStatus");

async function getStore() {
    const { data, error } = await supabase
        .from("verification_requests")
        .select("id, requester_id, email, farm_name, role, status, created_at, updated_at")
        .order("created_at", { ascending: false });

    if (error) {
        throw error;
    }

    return data || [];
}

async function saveStore(id, action) {
    const status = action === "approve" ? "approved" : "rejected";
    const updatedAt = new Date().toISOString();
    const payload = action === "approve"
        ? { status, approved_at: updatedAt, rejected_at: null, updated_at: updatedAt }
        : { status, rejected_at: updatedAt, approved_at: null, updated_at: updatedAt };

    const { error } = await supabase.from("verification_requests").update(payload).eq("id", id);
    if (error) throw error;
}

async function isAdminUser(userId) {
    if (!userId) return false;

    const { data, error } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .single();

    if (error || !data) return false;
    return String(data.role || "").toLowerCase() === "admin";
}

function renderRequests(requests) {
    if (!requests.length) {
        statusBox.innerHTML = `
            <div class="section-title">Admin approval</div>
            <div class="setting-item" style="display:block;">
                <div style="color:#cbd5e1;">No verification requests yet.</div>
            </div>
        `;
        return;
    }

    statusBox.innerHTML = `
        <div class="section-title">Admin approval</div>
        ${requests.map(request => `
            <div class="setting-item" style="display:block; border:1px solid rgba(148,163,184,0.12); border-radius:14px; background:rgba(15,23,42,0.85);">
                <div style="font-weight:700; color:#f8fafc; margin-bottom:6px;">${request.farm_name || "Farm / Supplier"}</div>
                <div style="font-size:13px; color:#94a3b8; margin-bottom:4px;">${request.role || "farmer"}</div>
                <div style="font-size:13px; color:#cbd5e1; margin-bottom:6px;">${request.email}</div>
                <div style="font-size:12px; color:#86efac; margin-bottom:10px;">Status: ${request.status || "pending"}</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="primary-btn inline-action" data-action="approve" data-id="${request.id}">Approve</button>
                    <button class="secondary-btn inline-action" data-action="reject" data-id="${request.id}">Reject</button>
                </div>
            </div>
        `).join('')}
    `;

    statusBox.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", async () => {
            const id = button.getAttribute("data-id");
            const action = button.getAttribute("data-action");
            try {
                await saveStore(id, action);
                await loadRequests();
            } catch (error) {
                statusBox.innerHTML = `<div class="section-title">Update failed</div><div class="setting-item" style="display:block;"><div style="color:#fca5a5;">${error.message || "Unable to update verification request."}</div></div>`;
            }
        });
    });
}

async function loadRequests() {
    const { data } = await supabase.auth.getSession();
    const userId = data?.session?.user?.id || "";

    if (!userId) {
        statusBox.innerHTML = `
            <div class="section-title">Authentication required</div>
            <div class="setting-item" style="display:block;">
                <div style="color:#fca5a5;">Sign in to continue.</div>
            </div>
        `;
        return;
    }

    const isAdmin = await isAdminUser(userId);
    if (!isAdmin) {
        statusBox.innerHTML = `
            <div class="section-title">Admin access</div>
            <div class="setting-item" style="display:block;">
                <div style="color:#fca5a5;">Only admin accounts can approve verification requests.</div>
            </div>
        `;
        return;
    }

    try {
        const requests = await getStore();
        renderRequests(requests);
    } catch (error) {
        statusBox.innerHTML = `
            <div class="section-title">Unable to load requests</div>
            <div class="setting-item" style="display:block;">
                <div style="color:#fca5a5;">${error.message || "Unable to load verification requests."}</div>
            </div>
        `;
    }
}

loadRequests();
</script>
</body>
</html>
