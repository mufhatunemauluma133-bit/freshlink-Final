<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://cdn.jsdelivr.net https://openrouter.ai; font-src 'self' data: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">
<title>AI Farm Assistant</title>
<link rel="stylesheet" href="style.css">
<style>
    .ai-page { padding: 16px 16px 120px; }
    .ai-card {
        background: rgba(10, 18, 34, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 14px;
    }
    .ai-card h3 { margin: 0 0 10px; color: #f8fafc; }
    .ai-card p { margin: 0 0 10px; color: #94a3b8; font-size: 13px; line-height: 1.5; }
    .ai-row { display: grid; gap: 10px; }
    .coming-soon-hero {
        display: grid;
        gap: 12px;
    }
    .coming-soon-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.16);
    }
    .coming-soon-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.16);
        color: #bbf7d0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        width: fit-content;
    }
</style>
</head>
<body>
<script type="module" src="app.js"></script>

<div class="topbar">
    <button onclick="window.location.href='menu.html'">Back</button>
    <div class="title">AI Farm Assistant</div>
    <div style="width: 30px;"></div>
</div>

<div class="page ai-page">
    <div class="ai-card">
        <div class="coming-soon-hero">
            <span class="coming-soon-badge">Coming soon</span>
            <img class="coming-soon-image" src="https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1200&q=80" alt="Modern farm landscape">
            <h3>Farm AI &amp; AgriMed</h3>
            <p>FreshLink is preparing smart farm guidance, crop intelligence, animal care support, and agricultural health insights for farmers and agricultural communities.</p>
    </div>
</div>

<div class="navbar">
    <button onclick="window.location.href='home.html'">Home</button>
    <button onclick="window.location.href='feed.html'">Feed</button>
    <button onclick="window.location.href='search.html'">Search</button>
    <button onclick="window.location.href='profile.html'">Profile</button>
    <button class="active" onclick="window.location.href='menu.html'">More</button>
</div>

<script type="module" src="ai-farm.js"></script>
</body>
</html>
